# github-data-collector configuration (Forgejo)
#
# .github.back/profile-gen.yml 과 독립이다. 완전 이관을 전제로 하므로
# GitHub 쪽 파일을 참조하지 않는다. GitHub 으로 되돌릴 때는 저쪽을 쓴다.

collectors:
  contributions:
    enabled: true
    sinceDate: "2024-01-01" # Fetch all contributions since this date

  releases:
    enabled: true
    sinceDate: "2024-01-01" # Fetch all releases since this date

  recentWork:
    enabled: true
    apiLimit: 10

  stars:
    enabled: true

  rss:
    enabled: false

# 경로는 저장소 루트 기준이라 GitHub 때와 같다.
paths:
  template: templates/README.md.liquid
  output: README.md
  data: data
