name: Update Profile README

# 이 저장소는 Forgejo(git.moseoh.com)가 정본이고 GitHub 은 푸시 미러다.
# GitHub Actions 로 돌리면 만든 커밋이 다음 미러 동기화(force-push)에
# 지워지므로 여기서 돌린다. 원본은 .github.back/workflows/readme.yml.

on:
  push:
    branches: [main]
    paths:
      - "templates/README.md.liquid"
  schedule:
    # Forgejo 의 기본 시간대는 UTC 다 (파드의 TZ=Asia/Seoul 은 스케줄러에
    # 영향이 없다). TZ= 접두사로 한국 시간을 명시한다.
    - cron: "TZ=Asia/Seoul 0 7 * * *" # 매일 아침 7시 (KST)
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      # checkout·setup-node 는 data.forgejo.org 에 있어 짧은 이름으로 받는다.
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: github-data-collector/package-lock.json

      - name: Install dependencies
        working-directory: github-data-collector
        run: npm ci

      - name: Build
        working-directory: github-data-collector
        run: npm run build

      # PERSONAL_GITHUB_TOKEN 은 GitHub GraphQL 조회용이다 — 이 저장소에
      # 커밋하는 토큰과는 다르다. 그쪽은 Forgejo 가 작업마다 자동 발급한다.
      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          INPUT_GITHUB-TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          INPUT_CONFIG-PATH: .forgejo/profile-gen.yml
          INPUT_USERNAME: moseoh
        run: node github-data-collector/dist/index.js

      # data.forgejo.org 에 없어 전체 URL 로 GitHub 것을 가리킨다.
      - name: Commit changes
        uses: https://github.com/stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update README and data"
          file_pattern: "README.md data/*.json"
          commit_user_name: github-profile-gen 🤖
          commit_user_email: actions@github.com
          commit_author: github-profile-gen 🤖 <actions@github.com>
